name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.5
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests

  # The hooks run on the python3 that ships with macOS (3.9), so test on it directly.
  test-macos-system-python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/python3 --version
      - run: /usr/bin/python3 -m unittest discover -s tests
